[task]
name = "afterquery/reckon-section-earthworks"

[metadata]
author_name = "Inesh Reddy Chappidi"
author_email = "ineshhreddy249@gmail.com"

difficulty_explanation = """
Taking cut, fill and topsoil strip off levelled cross-sections is everyday work
for a highways quantity surveyor or an earthworks estimator, done from exactly
what ships here: the surveyors' field books, the designer's template and
formation levels, the land schedule and the office's note. The data is
synthetic and was made truth first: the ground of 5 schemes was laid
down as a surface in the designer's own frame, 321 cross-sections and
10838 levels of it, and only then was each field book written out in its
surveyor's units and with his hand. The sealed figures are exact by
construction and the records are static, so nothing is computed at marking
time.

The note gives every rule the marking uses: how a section is booked, how the
template sits and where its side slopes stop, what counts as cut and as fill,
and how deep each kind of land is stripped. Applied to the field books as
booked it gets 0 of 40 sections, because four surveyors booked
in a unit the note does not use - offsets in feet, levels in feet, levels in
millimetres, chainages in kilometres. Each is glaring, each is only a unit, and
leaving any one alone costs eight sections against an allowance of 4.

What decides the task is a hand. The note books an offset positive to the right
of the centreline looking up chainage; 2 of the 5 surveyors
booked theirs positive to the left, one of them a surveyor with an odd unit and
one the surveyor who otherwise kept to the note. Nothing says so, and the
note's own reading fails without a sign: a section is booked as far one way as
the other, the template sits on it either way, the side slopes find ground, and
every figure comes out - for the mirror image of the ground, under a template
that is wider on one side and a land schedule that is not the same either side.
It costs 16 of the 40. No first-order figure shows it. The
schemes cross no ditch, bank or hedge; the ground falls across the road
whichever way it falls; the two ends of a section are statistically alike; and
the five schemes are different ground, so no book can be laid against another.
What the land leaves in the levels is second order: ploughed ground is rougher
from one staff position to the next than pasture. Measured as how far a booked
level stands from the straight line between its two neighbours, the middle
value on arable land is at least 3.1 times that on pasture in every book
read in its true hand, and at most 1.0 times in the other. The
fall of the ground and its long undulations are far larger than either
roughness, and the odd gateway or track is rough on any land, so the plain
spread of levels by kind of land says nothing; and the land schedule is a file
the work needs anyway, for the topsoil.

tests/audit_task.py measures all of this against the sealed figures and refuses
to pass otherwise: of the 48 combinations of readings the proper one gets
40, the best other 32 against a bar of 36, every book taken as
left-handed 16, and the best single row given for every section
2.
"""

solution_explanation = """
solution/take_off.py, with solution/template.py, reads only /app and writes
/app/areas.csv with the standard library alone. It finds each field book's
units by setting its chainages, offsets and levels against the formation
levels and the reach of the land schedule. For each scheme it measures how far
every booked level stands from the line between its neighbours, groups that by
the kind of land the point stands on - once with offsets as booked and once
mirrored - and keeps the hand under which arable comes out rougher than
pasture. It then lays the template on each wanted section: a level formation,
a cut or a fill slope from each edge according to the ground there, run out to
where it first meets the ground; integrates ground above template and template
above ground exactly between those two points, piece by piece between booked
points and crossings; and adds the strip depth of each kind of land over the
same width. Run in the task's own container it gets 40 of 40.
"""

verification_explanation = """
The verifier reads /app/areas.csv as text with the csv module and compares each
wanted section's three areas with the sealed figures in /tests/sealed.json,
each within 0.2 square metres; at most 4 of the 40 rows may be
wrong. Nothing the agent wrote is imported or executed, the sealed figures
exist only in the verifier image, /tests is mode 700 there and the agent's
container never mounts it. The 0.2 is rounding room: the sealed figures are
those the reference gets from the books as booked, feet and all, and every
wanted section was chosen so that the ground at each edge of the formation is
at least a quarter of a metre clear of formation level in either hand - so the
choice of cut or fill slope is never in doubt - and so that the wrong hand
moves at least one of its areas by a square metre and a half or more. Nothing
in the agent's container attests any area, no total has to balance, and a wrong
sheet is as self-consistent as the right one. The reward is binary and written
to /logs/verifier/reward.txt on every path; an empty container scores 0 and the
reference scores 1. The generator is seeded and shipped.
"""

category = "Operations"
subcategory = "Highway Earthworks"
tags = ["earthworks", "cross-sections", "survey-data", "computational-geometry", "python"]
expert_time_estimate_hours = 6
relevant_experience = """
An earthworks estimator or a highways surveyor will know all of it: field books
that arrive in whatever units the surveyor's staff was graduated in, a surveyor
who books his offsets from the other side because he walked the line the other
way, and the look of ploughed land in a line of levels.
"""

